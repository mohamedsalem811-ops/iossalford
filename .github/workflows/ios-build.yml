name: Build Native iOS App (SwiftUI)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'SalfordJewelryPOS/**'
      - 'SalfordJewelryPOS.xcodeproj/**'
      - '.github/workflows/ios-build.yml'
  pull_request:
    paths:
      - 'SalfordJewelryPOS/**'
      - 'SalfordJewelryPOS.xcodeproj/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

jobs:
  build-ios:
    name: Compile 100% Native SwiftUI iOS App on macOS
    runs-on: macos-15
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5

      # App Store uploads must be built with a recent iOS SDK, so use the newest
      # stable (non-beta) Xcode installed on the runner instead of a pinned old one.
      - name: Select newest stable Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Build Unsigned .app & Package .ipa
        run: |
          xcodebuild clean build \
            -project SalfordJewelryPOS.xcodeproj \
            -scheme SalfordJewelryPOS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build_output \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          mkdir -p Payload
          cp -r build_output/Build/Products/Release-iphoneos/SalfordJewelryPOS.app Payload/
          zip -r SalfordJewelryPOS-Native-iOS.ipa Payload

      - name: Upload Native iOS .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SalfordJewelryPOS-Native-iOS-IPA
          path: SalfordJewelryPOS-Native-iOS.ipa
