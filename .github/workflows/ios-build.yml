name: Build Native iOS App (SwiftUI)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Compile 100% Native SwiftUI iOS App on macOS
    runs-on: macos-14
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Select Xcode 15.4
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Build Unsigned .app & Package .ipa
        run: |
          xcodebuild clean build \
            -project SalfordJewelryPOS.xcodeproj \
            -scheme SalfordJewelryPOS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build_output \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          mkdir -p Payload
          cp -r build_output/Build/Products/Release-iphoneos/SalfordJewelryPOS.app Payload/
          zip -r SalfordJewelryPOS-Native-iOS.ipa Payload

      - name: Upload Native iOS .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SalfordJewelryPOS-Native-iOS-IPA
          path: SalfordJewelryPOS-Native-iOS.ipa
