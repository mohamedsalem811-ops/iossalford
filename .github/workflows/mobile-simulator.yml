name: Expo app simulator tests

# Builds the app for the iOS simulator, runs the Maestro tap-through tests on an
# iPhone and an iPad simulator, and uploads the screenshots.

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-simulator.yml'
  # Heavy build: runs once a phase PR is ready (not on every step pushed to a draft).
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-simulator.yml'
  workflow_dispatch:

concurrency:
  group: mobile-simulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    name: Maestro on iPhone and iPad simulators
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Select newest stable Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          # Expo SDK 58 needs Xcode 26.4 or newer.
          VER=$(xcodebuild -version | awk 'NR==1{print $2}')
          python3 -c "import sys; v=tuple(int(x) for x in '$VER'.split('.')); sys.exit(0 if v >= (26,4) else 'Xcode $VER is older than 26.4, which Expo SDK 58 needs')"

      - name: Install
        run: npm ci

      - name: Generate the iOS project
        run: npx expo prebuild --platform ios --clean

      - name: Build for the simulator (Release, JavaScript embedded)
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace ios/SALFORDPOS.xcworkspace \
            -scheme SALFORDPOS \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build_output \
            CODE_SIGNING_ALLOWED=NO | xcbeautify --renderer github-actions

      - name: Install Maestro
        working-directory: .
        run: |
          # The installer exits 0 even when its download fails (a 504 from the download server
          # did this once), so retry and confirm the binary runs before going on.
          for ATTEMPT in 1 2 3; do
            curl -fsSL "https://get.maestro.mobile.dev" | bash || true
            if "$HOME/.maestro/bin/maestro" --version; then break; fi
            [ "$ATTEMPT" -eq 3 ] && { echo "Maestro could not be installed"; exit 1; }
            echo "Maestro download failed; retrying in 20 s"
            rm -rf "$HOME/.maestro"
            sleep 20
          done
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run tests on iPhone and iPad
        env:
          # A freshly booted simulator is slow on its first launch; the default driver
          # start-up timeout was too short for the iPad run. A hung driver is retried once below.
          MAESTRO_DRIVER_STARTUP_TIMEOUT: '300000'
        run: |
          set -e
          APP=build_output/Build/Products/Release-iphonesimulator/SALFORDPOS.app
          mkdir -p screenshots
          pick() {
            xcrun simctl list devices available -j | python3 -c "
          import json, sys
          kind = sys.argv[1]
          devs = [d for rt, ds in json.load(sys.stdin)['devices'].items() if 'iOS' in rt for d in ds]
          names = [d for d in devs if d['name'].startswith(kind)]
          pro = [d for d in names if 'Pro' in d['name']] or names
          print(pro[-1]['udid'])" "$1"
          }
          for KIND in iPhone iPad; do
            UDID=$(pick "$KIND")
            echo "== $KIND: $UDID"
            xcrun simctl boot "$UDID" || true
            xcrun simctl bootstatus "$UDID" -b
            xcrun simctl install "$UDID" "$APP"
            # If Maestro's driver fails to start (a runner simulator hang, not a test result),
            # restart the simulator and try once more. Any other failure fails the job at once.
            for ATTEMPT in 1 2; do
              set +e
              maestro --device "$UDID" test -e DEVICE="$KIND" --test-output-dir "maestro-output/$KIND" e2e 2>&1 | tee "maestro-$KIND.log"
              STATUS=${PIPESTATUS[0]}
              set -e
              [ "$STATUS" -eq 0 ] && break
              if [ "$ATTEMPT" -eq 1 ] && grep -q "iOS driver not ready in time" "maestro-$KIND.log"; then
                echo "== Driver did not start on $KIND; restarting the simulator and retrying once"
                xcrun simctl shutdown "$UDID" || true
                xcrun simctl boot "$UDID"
                xcrun simctl bootstatus "$UDID" -b
                continue
              fi
              exit "$STATUS"
            done
            xcrun simctl shutdown "$UDID"
          done
          # Maestro may save screenshots next to the flow or in its output folder; collect them all.
          find e2e maestro-output . -maxdepth 4 -name '*.png' -not -path './node_modules/*' -not -path './screenshots/*' -exec cp {} screenshots/ \; 2>/dev/null || true
          ls -l screenshots
          test -n "$(ls screenshots)" || { echo "No screenshots were taken"; exit 1; }

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: simulator-screenshots
          path: |
            mobile/screenshots
            mobile/maestro-output
