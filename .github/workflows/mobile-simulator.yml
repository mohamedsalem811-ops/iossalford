name: Expo app simulator tests

# Builds the app for the iOS simulator once, then runs the Maestro tap-through tests on an
# iPhone and an iPad simulator, each device in two halves on machines side by side, and uploads
# the screenshots. The full check before 10.0: one machine per device took 242 of its 275 minutes
# for 40 flows (run 75), too close to the limit; a half takes about 130.
#
# Started by hand only (Actions -> "Expo app simulator tests" -> Run workflow): at the end of
# the project, or for a critical change. Every push runs the fast checks and the .ipa build, and
# the owner tests the Expo Go preview and the .ipa on the devices:
# GitHub's macOS simulators are slow and sometimes do not start, and each run takes about an
# hour.

on:
  workflow_dispatch:
    inputs:
      flows:
        description: 'Only these flows, by name and separated by spaces (e.g. "receipts sale"); empty runs them all'
        required: false
        default: ''

concurrency:
  group: mobile-simulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the app for the simulator
    runs-on: macos-26
    # A build has taken up to about 65 minutes.
    timeout-minutes: 120
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Select newest stable Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          # Expo SDK 58 needs Xcode 26.4 or newer.
          VER=$(xcodebuild -version | awk 'NR==1{print $2}')
          python3 -c "import sys; v=tuple(int(x) for x in '$VER'.split('.')); sys.exit(0 if v >= (26,4) else 'Xcode $VER is older than 26.4, which Expo SDK 58 needs')"

      - name: Install
        run: npm ci

      - name: Generate the iOS project
        run: npx expo prebuild --platform ios --clean

      - name: Build for the simulator (Release, JavaScript embedded)
        env:
          # The design gallery is in test builds only (1.9); the .ipa leaves it out.
          EXPO_PUBLIC_TEST_SCREENS: '1'
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace ios/SALFORDPOS.xcworkspace \
            -scheme SALFORDPOS \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build_output \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_ALLOWED=YES | xcbeautify --renderer github-actions

      # The app keeps its PINs in the Keychain. On the simulator an unsigned app has no
      # entitlements and every Keychain call fails, so the app is signed to run locally ("-",
      # no Apple account needed). The job stops here if the app is not signed; the entitlements
      # are printed for diagnosis (the Maestro flows are what prove the Keychain works).
      - name: Check the app is signed
        run: |
          APP=build_output/Build/Products/Release-iphonesimulator/SALFORDPOS.app
          codesign --verify --verbose=2 "$APP"
          codesign -d --entitlements - "$APP" 2>&1 || true

      # ditto keeps the app's signature and links; a plain zip of a .app can break both.
      - name: Pack the app for the test machines
        run: ditto -c -k --keepParent build_output/Build/Products/Release-iphonesimulator/SALFORDPOS.app SALFORDPOS.app.zip

      - name: Upload the app
        uses: actions/upload-artifact@v7
        with:
          name: simulator-app
          path: mobile/SALFORDPOS.app.zip
          retention-days: 3

  simulator:
    # One job per device and half, side by side: a second simulator in the same job often could not
    # start Maestro's driver while the first device's driver was still holding the host side.
    name: Maestro on ${{ matrix.device }} simulator, part ${{ matrix.part }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        device: [iPhone, iPad]
        part: [1, 2]
    runs-on: macos-26
    timeout-minutes: 300
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Select newest stable Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          # Expo SDK 58 needs Xcode 26.4 or newer.
          VER=$(xcodebuild -version | awk 'NR==1{print $2}')
          python3 -c "import sys; v=tuple(int(x) for x in '$VER'.split('.')); sys.exit(0 if v >= (26,4) else 'Xcode $VER is older than 26.4, which Expo SDK 58 needs')"

      - name: Boot the ${{ matrix.device }} simulator in the background
        # A freshly booted simulator keeps doing first-boot work for minutes after it reports
        # "booted"; Maestro's driver then sometimes never started. It now boots and settles while
        # the app is fetched and Maestro installed. Maestro is not started here.
        run: |
          set -e
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          kind = sys.argv[1]
          devs = [d for rt, ds in json.load(sys.stdin)['devices'].items() if 'iOS' in rt for d in ds]
          names = [d for d in devs if d['name'].startswith(kind)]
          pro = [d for d in names if 'Pro' in d['name']] or names
          print(pro[-1]['udid'])" '${{ matrix.device }}')
          echo "== ${{ matrix.device }}: $UDID"
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          cat > "$RUNNER_TEMP/warm-up.sh" <<'EOF'
          UDID=$1
          say() { echo "== $(date +%T) $*"; }
          say "booting"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          # Open and close a system app once, so the first app launch is done before the tests.
          xcrun simctl launch "$UDID" com.apple.Preferences && sleep 15
          xcrun simctl terminate "$UDID" com.apple.Preferences || true
          # It used to settle while the app built (about 25 minutes); the app now comes built, so
          # it is given 5 minutes of its first-boot work before Maestro's driver starts.
          sleep 300
          say "simulator is ready"
          EOF
          nohup bash "$RUNNER_TEMP/warm-up.sh" "$UDID" > "$RUNNER_TEMP/warm-up.log" 2>&1 < /dev/null &
          echo "Warm-up started in the background"

      - name: Fetch the app built once for every test machine
        uses: actions/download-artifact@v7
        with:
          name: simulator-app
          path: mobile

      - name: Unpack the app
        run: |
          mkdir -p build_output/Build/Products/Release-iphonesimulator
          ditto -x -k SALFORDPOS.app.zip build_output/Build/Products/Release-iphonesimulator
          codesign --verify --verbose=2 build_output/Build/Products/Release-iphonesimulator/SALFORDPOS.app

      - name: Install Maestro
        working-directory: .
        run: |
          # The installer exits 0 even when its download fails (a 504 from the download server
          # did this once), so retry and confirm the binary runs before going on.
          for ATTEMPT in 1 2 3; do
            curl -fsSL "https://get.maestro.mobile.dev" | bash || true
            if "$HOME/.maestro/bin/maestro" --version; then break; fi
            [ "$ATTEMPT" -eq 3 ] && { echo "Maestro could not be installed"; exit 1; }
            echo "Maestro download failed; retrying in 20 s"
            rm -rf "$HOME/.maestro"
            sleep 20
          done
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run part ${{ matrix.part }} of the tests on the ${{ matrix.device }} simulator
        # Run 68 (iPad): the tests ran into the job's limit, GitHub stopped the machine and the
        # upload below never ran, so nothing was kept. The tests stop first, leaving time to upload
        # what they produced. A half has taken about 130 minutes.
        timeout-minutes: 240
        env:
          # A freshly booted simulator is slow on its first launch; the default driver
          # start-up timeout was too short for the iPad run (5 minutes was not always enough
          # either). A hung driver is retried once below.
          MAESTRO_DRIVER_STARTUP_TIMEOUT: '420000'
          ONLY_FLOWS: ${{ inputs.flows }}
        run: |
          set -e
          APP=build_output/Build/Products/Release-iphonesimulator/SALFORDPOS.app
          mkdir -p screenshots
          KIND='${{ matrix.device }}'
          # This machine's half of the flows (scripts/flow-parts.mjs, tested in Jest), or, when
          # the run names some flows (to rerun the ones fixed after a run), all of them on part 1.
          if [ -n "$ONLY_FLOWS" ]; then
            if [ '${{ matrix.part }}' != '1' ]; then
              echo "== Only $ONLY_FLOWS: all on part 1, nothing for this part"
              exit 0
            fi
            FLOWS=""
            for NAME in $ONLY_FLOWS; do
              case "$NAME" in *[!a-z0-9-]*) echo "Not a flow name: $NAME"; exit 2 ;; esac
              [ -f "e2e/$NAME.yaml" ] || { echo "No flow e2e/$NAME.yaml"; exit 2; }
              FLOWS="$FLOWS e2e/$NAME.yaml"
            done
          else
            FLOWS=$(node scripts/flow-parts.mjs '${{ matrix.part }}' 2)
          fi
          echo "== Part ${{ matrix.part }} on $KIND: $FLOWS"
          {
            UDID="$SIM_UDID"
            # The warm-up started at the beginning of the job; wait for it if it is still going.
            for _ in $(seq 1 90); do
              grep -q "simulator is ready" "$RUNNER_TEMP/warm-up.log" && break
              sleep 10
            done
            cat "$RUNNER_TEMP/warm-up.log"
            xcrun simctl boot "$UDID" || true
            xcrun simctl bootstatus "$UDID" -b
            xcrun simctl install "$UDID" "$APP"
            # If Maestro's driver fails to start (a runner simulator hang, not a test result),
            # restart the simulator and try once more. Any other failure fails the job at once.
            for ATTEMPT in 1 2; do
              set +e
              # shellcheck disable=SC2086 # one flow file per word
              maestro --device "$UDID" test -e DEVICE="$KIND" --test-output-dir "maestro-output/$KIND" $FLOWS 2>&1 | tee "maestro-$KIND.log"
              STATUS=${PIPESTATUS[0]}
              set -e
              [ "$STATUS" -eq 0 ] && break
              if [ "$ATTEMPT" -eq 1 ] && grep -q "iOS driver not ready in time" "maestro-$KIND.log"; then
                echo "== Driver did not start on $KIND; restarting the simulator and retrying once"
                # The first driver's xcodebuild keeps running after Maestro gives up and can stop
                # the second one from starting; nothing else uses xcodebuild at this point.
                pkill -f xcodebuild || true
                # Start from a clean simulator: erase it, boot it and install the app again.
                xcrun simctl shutdown "$UDID" || true
                xcrun simctl erase "$UDID"
                xcrun simctl boot "$UDID"
                xcrun simctl bootstatus "$UDID" -b
                xcrun simctl install "$UDID" "$APP"
                continue
              fi
              # The driver can also stop in the middle of the run (run 65, iPad: XCTest could not
              # read the keyboard's window and ended its only test). Every flow after that "fails"
              # in seconds without being tested. Those flows run once more on a restarted
              # simulator; a flow that failed by itself still fails the job.
              RUN_DIR=$(ls -d "maestro-output/$KIND"/*/ 2>/dev/null | tail -1)
              CUT_OFF=''
              [ -n "$RUN_DIR" ] && CUT_OFF=$(node scripts/driver-killed-flows.mjs killed "$RUN_DIR")
              if [ -n "$CUT_OFF" ]; then
                FAILED=$(node scripts/driver-killed-flows.mjs failed "$RUN_DIR")
                echo "== The Maestro driver stopped on $KIND; running again the flows it cut off: $CUT_OFF"
                pkill -f xcodebuild || true
                xcrun simctl shutdown "$UDID" || true
                xcrun simctl erase "$UDID"
                xcrun simctl boot "$UDID"
                xcrun simctl bootstatus "$UDID" -b
                xcrun simctl install "$UDID" "$APP"
                set +e
                # shellcheck disable=SC2086 # one flow file per word
                maestro --device "$UDID" test -e DEVICE="$KIND" --test-output-dir "maestro-output/$KIND-again" $CUT_OFF 2>&1 | tee "maestro-$KIND-again.log"
                STATUS=${PIPESTATUS[0]}
                set -e
                if [ -n "$FAILED" ]; then
                  echo "== Failed before the driver stopped: $FAILED"
                  exit 1
                fi
                [ "$STATUS" -eq 0 ] && break
              fi
              exit "$STATUS"
            done
            xcrun simctl shutdown "$UDID"
          }
          # The flows' named screenshots (takeScreenshot) are saved in Maestro's output folder, under
          # <device>/<run>/<flow>/takeScreenshot/. Failure screenshots stay in maestro-output.
          find maestro-output -path '*/takeScreenshot/*.png' -exec cp {} screenshots/ \;
          ls -l screenshots
          test -n "$(ls screenshots)" || { echo "No screenshots were taken"; exit 1; }

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: simulator-screenshots-${{ matrix.device }}-part-${{ matrix.part }}
          path: |
            mobile/screenshots
            mobile/maestro-output
