name: Expo app unsigned .ipa

# Builds the new Expo app as an unsigned .ipa for Sideloadly (iPhone and iPad).

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ipa.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ipa.yml'
  workflow_dispatch:

concurrency:
  group: mobile-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    name: Build unsigned .ipa
    runs-on: macos-26
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Select newest stable Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          # Expo SDK 58 needs Xcode 26.4 or newer.
          VER=$(xcodebuild -version | awk 'NR==1{print $2}')
          python3 -c "import sys; v=tuple(int(x) for x in '$VER'.split('.')); sys.exit(0 if v >= (26,4) else 'Xcode $VER is older than 26.4, which Expo SDK 58 needs')"

      - name: Install
        run: npm ci

      - name: Generate the iOS project
        run: npx expo prebuild --platform ios --clean

      - name: Build (Release, unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace ios/SALFORDPOS.xcworkspace \
            -scheme SALFORDPOS \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build_output \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO | xcbeautify --renderer github-actions

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -r build_output/Build/Products/Release-iphoneos/SALFORDPOS.app Payload/
          zip -qr SALFORD-POS-Expo.ipa Payload
          ls -lh SALFORD-POS-Expo.ipa

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: SALFORD-POS-Expo-IPA
          path: mobile/SALFORD-POS-Expo.ipa
