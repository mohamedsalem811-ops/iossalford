# Audit batch 3 (database 7): the shop pays back a customer's credit ("له رصيد").
# Sara buys the ring on credit, pays it in full, then returns it: the shop owes her 350. The owner
# pays it back in cash and her balance ends at zero.
appId: com.salford.pos
---
- runFlow: subflows/open-jewelry.yaml
- runFlow: subflows/add-ring.yaml
- tapOn: 'بيع'
- tapOn:
    id: 'sale-tile-Ring Zircon'
- runFlow:
    when:
      visible:
        id: 'cart-bar'
    commands:
      - tapOn:
          id: 'cart-bar'
- tapOn:
    id: 'cart-checkout'
- tapOn: 'آجل'
- tapOn:
    id: 'checkout-name'
- inputText: 'Sara'
- tapOn:
    id: 'keyboard.toolbar.done'
- runFlow:
    file: subflows/scroll-form.yaml
    env:
      ID: 'checkout-confirm'
- tapOn:
    id: 'checkout-confirm'
- extendedWaitUntil:
    visible:
      id: 'sold-title'
    timeout: 30000
- tapOn:
    id: 'sold-new-sale'
# She pays it all.
- runFlow:
    file: subflows/open-section.yaml
    env:
      ID: 'manage-customers'
- tapOn:
    id: 'customer-Sara'
- tapOn:
    id: 'customer-pay'
- tapOn:
    id: 'payment-save'
# She returns it: the refund becomes her credit.
- runFlow:
    file: subflows/scroll-form.yaml
    env:
      ID: 'customer-sale-[0-9]+'
- tapOn:
    id: 'customer-sale-[0-9]+'
- runFlow:
    file: subflows/scroll-form.yaml
    env:
      ID: 'sale-return-[0-9]+'
- tapOn:
    id: 'sale-return-[0-9]+'
- runFlow: subflows/return-photo.yaml
- runFlow: subflows/save-return.yaml
- runFlow:
    file: subflows/open-section.yaml
    env:
      ID: 'manage-customers'
- tapOn:
    id: 'customer-Sara'
- assertVisible: '.*له رصيد.*'
- takeScreenshot: ${DEVICE}-customer-credit
- tapOn:
    id: 'customer-payout'
- takeScreenshot: ${DEVICE}-payout-form
- tapOn:
    id: 'payment-save'
- assertVisible: 'لا ديون'
