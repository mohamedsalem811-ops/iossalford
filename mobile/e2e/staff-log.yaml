# Phase S3: who did what. سارة opens a shift and sells Ring Zircon; the owner signs in, finds her
# sales in the month summary per seller and her sale under her name in the activity log.
# iPhone and iPad (screens: sales per seller, activity log).
appId: com.salford.pos
---
- runFlow: subflows/open-jewelry.yaml
- runFlow: subflows/add-ring.yaml
- runFlow: subflows/add-employee.yaml
- runFlow: subflows/open-shift.yaml
- runFlow: subflows/sell-ring.yaml
- tapOn:
    id: 'sold-new-sale'
- runFlow: subflows/sign-in-owner.yaml
# The month summary: sales per seller.
- scrollUntilVisible:
    element:
      text: 'البائع'
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn: 'البائع'
- assertVisible:
    id: 'by-seller'
- assertVisible: 'سارة.*'
- takeScreenshot: ${DEVICE}-sales-per-seller
# The activity log: her sale, by her, and the owner's sign-in.
- runFlow:
    file: subflows/open-section.yaml
    env:
      ID: 'manage-log'
- extendedWaitUntil:
    visible: 'بيعة رقم .*'
    timeout: 15000
- assertVisible: 'بيعة رقم .*سارة.*'
- assertVisible: 'دخول المالك.*'
- takeScreenshot: ${DEVICE}-activity-log
