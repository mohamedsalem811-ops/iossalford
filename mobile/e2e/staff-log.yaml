# Phase S3: who did what. Runs after staff-permissions.yaml (سارة has sold the Ring and is
# signed in). The owner signs in, finds her sale under her name in the activity log and her
# sales in the month summary per seller. iPhone and iPad, light and dark (screens: log, seller).
appId: com.salford.pos
---
- tapOn: 'الإدارة'
- scrollUntilVisible:
    element:
      id: 'manage-lock'
    direction: DOWN
- tapOn:
    id: 'manage-lock'
- tapOn:
    id: 'person-owner'
- runFlow: subflows/pin-jewelry.yaml
- extendedWaitUntil:
    visible: 'مبيعات اليوم'
    timeout: 30000
# The month summary: sales per seller.
- scrollUntilVisible:
    element:
      text: 'البائع'
    direction: DOWN
- tapOn: 'البائع'
- assertVisible:
    id: 'by-seller'
- assertVisible: 'سارة'
- takeScreenshot: ${DEVICE}-sales-per-seller
# The activity log: her sale, by her, and the sign-ins.
- tapOn: 'الإدارة'
- scrollUntilVisible:
    element:
      id: 'manage-log'
    direction: DOWN
- tapOn:
    id: 'manage-log'
- extendedWaitUntil:
    visible: 'بيعة رقم .*'
    timeout: 15000
- assertVisible: 'سارة • .*'
- assertVisible: 'دخول المالك'
- takeScreenshot: ${DEVICE}-activity-log
