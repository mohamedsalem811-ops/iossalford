# Phase 4: a scarf design with two sizes (one added with the quick-add button), shown by design.
# On iPad the designs are photo cards and the form opens as a window over them; the steps are the same.
appId: com.salford.pos
---
- runFlow: subflows/fresh-launch.yaml
- runFlow: subflows/setup-pins.yaml
- tapOn: 'نظام الأوشحة'
- runFlow: subflows/pin-scarves.yaml
- extendedWaitUntil:
    visible: 'مبيعات اليوم'
    timeout: 90000
- tapOn: 'المنتجات'
- extendedWaitUntil:
    visible: 'لا توجد أوشحة بعد'
    timeout: 30000
- tapOn: 'تصميم جديد'
- extendedWaitUntil:
    visible:
      id: 'design-name'
    timeout: 30000
- tapOn:
    id: 'design-name'
- inputText: 'Silk Classic'
# Closes the keyboard with the app's own \"تم\" bar (Maestro's hideKeyboard can't, since 2026).
- tapOn:
    id: 'keyboard.toolbar.done'
# A new design starts with a 90×90 row.
- scrollUntilVisible:
    element:
      id: 'size-price-0'
    direction: DOWN
- tapOn:
    id: 'size-price-0'
- inputText: '90'
# Closes the keyboard with the app's own \"تم\" bar (Maestro's hideKeyboard can't, since 2026).
- tapOn:
    id: 'keyboard.toolbar.done'
- scrollUntilVisible:
    element:
      id: 'size-cost-0'
    direction: DOWN
- tapOn:
    id: 'size-cost-0'
- inputText: '30'
# Closes the keyboard with the app's own \"تم\" bar (Maestro's hideKeyboard can't, since 2026).
- tapOn:
    id: 'keyboard.toolbar.done'
- scrollUntilVisible:
    element:
      id: 'add-size-120×120'
    direction: DOWN
- tapOn:
    id: 'add-size-120×120'
- scrollUntilVisible:
    element:
      id: 'size-price-1'
    direction: DOWN
- tapOn:
    id: 'size-price-1'
- inputText: '120'
# Closes the keyboard with the app's own \"تم\" bar (Maestro's hideKeyboard can't, since 2026).
- tapOn:
    id: 'keyboard.toolbar.done'
- scrollUntilVisible:
    element:
      id: 'size-cost-1'
    direction: DOWN
- tapOn:
    id: 'size-cost-1'
- inputText: '40'
# Closes the keyboard with the app's own \"تم\" bar (Maestro's hideKeyboard can't, since 2026).
- tapOn:
    id: 'keyboard.toolbar.done'
- takeScreenshot: ${DEVICE}-design-form
- scrollUntilVisible:
    element:
      id: 'design-save'
    direction: DOWN
- tapOn:
    id: 'design-save'
- extendedWaitUntil:
    visible: '.*Silk Classic.*'
    timeout: 30000
- assertVisible: '.*90×90: 1.*'
- assertVisible: '.*120×120: 1.*'
- assertVisible: '.*90 – 120 د.ل.*'
- assertVisible: '.*1 تصميم • 2 قطعة.*'
- takeScreenshot: ${DEVICE}-designs-list
