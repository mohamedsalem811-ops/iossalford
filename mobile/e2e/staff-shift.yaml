# Phase S5: the shift and the cash count. سارة opens a shift with 100 د.ل, sells Ring Zircon in
# cash, takes 20 out for change, and closes with a blind count of 0: a shortage in her name.
# The owner reads the report and puts the shortage on her account. iPhone and iPad (screens:
# shift, close, list, report).
appId: com.salford.pos
---
- runFlow: subflows/open-jewelry.yaml
- runFlow: subflows/add-ring.yaml
- runFlow: subflows/add-employee.yaml
- runFlow: subflows/open-shift.yaml
- runFlow: subflows/sell-ring.yaml
- tapOn:
    id: 'sold-new-sale'
# Cash out with a reason.
- runFlow:
    file: subflows/open-section.yaml
    env:
      ID: 'manage-shift'
- tapOn:
    id: 'shift-move-amount'
- inputText: '20'
- tapOn:
    id: 'keyboard.toolbar.done'
- tapOn:
    id: 'shift-move-reason'
- inputText: 'فكة'
- tapOn:
    id: 'keyboard.toolbar.done'
- runFlow:
    file: subflows/scroll-form.yaml
    env:
      ID: 'shift-cash-out'
- tapOn:
    id: 'shift-cash-out'
- assertVisible: 'فكة'
- takeScreenshot: ${DEVICE}-shift-open
# The blind count: the expected cash shows only after closing.
- assertNotVisible:
    id: 'shift-expected'
- runFlow:
    file: subflows/scroll-form.yaml
    env:
      ID: 'shift-counted'
- tapOn:
    id: 'shift-counted'
- inputText: '0'
- tapOn:
    id: 'keyboard.toolbar.done'
- runFlow:
    file: subflows/scroll-form.yaml
    env:
      ID: 'shift-close'
- tapOn:
    id: 'shift-close'
- tapOn: 'إغلاق'
- assertVisible:
    id: 'shift-difference'
- assertVisible: 'عجز.*'
- takeScreenshot: ${DEVICE}-shift-closed
# The home screen asks her to open a shift before selling again.
- tapOn: 'الرئيسية'
- assertVisible:
    id: 'open-shift'
# The owner: the list of shifts, the report, the shortage on her account.
- runFlow: subflows/sign-in-owner.yaml
- runFlow:
    file: subflows/open-section.yaml
    env:
      ID: 'manage-shifts'
- takeScreenshot: ${DEVICE}-shifts
- tapOn:
    index: 0
    id: 'shift-[0-9]+'
- assertVisible:
    id: 'report-person'
- takeScreenshot: ${DEVICE}-shift-report
- scrollUntilVisible:
    element:
      id: 'report-charge'
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn:
    id: 'report-charge'
- tapOn: 'تحميل'
- assertVisible:
    id: 'report-charged'
