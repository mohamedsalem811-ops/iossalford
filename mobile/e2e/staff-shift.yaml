# Phase S5: the shift and the cash count. Runs after staff-returns.yaml (سارة has an open shift
# from staff-permissions.yaml). She takes 20 د.ل out for change, sells the Ring in cash, and
# closes with a blind count of 0: a shortage in her name. The owner reads the report and puts the
# shortage on her account. iPhone and iPad, light and dark (screens: shift, close, list, report).
appId: com.salford.pos
---
- tapOn: 'الإدارة'
- scrollUntilVisible:
    element:
      id: 'manage-lock'
    direction: DOWN
- tapOn:
    id: 'manage-lock'
- tapOn:
    id: 'person-سارة'
- tapOn:
    id: 'pin-key-9'
- tapOn:
    id: 'pin-key-6'
- tapOn:
    id: 'pin-key-3'
- tapOn:
    id: 'pin-key-2'
- tapOn:
    id: 'pin-key-5'
- tapOn:
    id: 'pin-key-8'
- extendedWaitUntil:
    visible: 'أهلاً، سارة'
    timeout: 30000
# A cash sale in her shift.
- runFlow: subflows/sell-ring.yaml
- tapOn:
    id: 'sold-new-sale'
# Cash out with a reason.
- tapOn: 'الإدارة'
- tapOn:
    id: 'manage-shift'
- tapOn:
    id: 'shift-move-amount'
- inputText: '20'
- tapOn:
    id: 'shift-move-reason'
- inputText: 'فكة'
- tapOn:
    id: 'shift-cash-out'
- assertVisible: 'فكة'
- takeScreenshot: ${DEVICE}-shift-open
# The blind count: the expected cash shows only after closing.
- assertNotVisible:
    id: 'shift-expected'
- scrollUntilVisible:
    element:
      id: 'shift-counted'
    direction: DOWN
- tapOn:
    id: 'shift-counted'
- inputText: '0'
- tapOn:
    id: 'shift-close'
- tapOn: 'إغلاق'
- assertVisible:
    id: 'shift-difference'
- assertVisible: 'عجز.*'
- takeScreenshot: ${DEVICE}-shift-closed
# The home screen asks her to open a shift before selling again.
- tapOn: 'الرئيسية'
- assertVisible:
    id: 'open-shift'
# The owner: the list of shifts, the report, the shortage on her account.
- tapOn: 'الإدارة'
- scrollUntilVisible:
    element:
      id: 'manage-lock'
    direction: DOWN
- tapOn:
    id: 'manage-lock'
- tapOn:
    id: 'person-owner'
- runFlow: subflows/pin-jewelry.yaml
- extendedWaitUntil:
    visible: 'مبيعات اليوم'
    timeout: 30000
- tapOn: 'الإدارة'
- scrollUntilVisible:
    element:
      id: 'manage-shifts'
    direction: DOWN
- tapOn:
    id: 'manage-shifts'
- takeScreenshot: ${DEVICE}-shifts
- tapOn:
    index: 0
    id: 'shift-[0-9]+'
- assertVisible:
    id: 'report-person'
- takeScreenshot: ${DEVICE}-shift-report
- scrollUntilVisible:
    element:
      id: 'report-charge'
    direction: DOWN
- tapOn:
    id: 'report-charge'
- tapOn: 'تحميل'
- assertVisible:
    id: 'report-charged'
