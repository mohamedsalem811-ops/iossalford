# 10.0: the employee's auto-lock. The owner sets the shortest times (lock after 3 minutes, the
# warning 1 minute before) and adds سارة; she signs in and leaves the screen untouched: the
# countdown banner shows after 2 minutes, then the app locks to «من يستخدم النظام؟».
# iPhone and iPad (screens: lock settings, warning, locked).
appId: com.salford.pos
---
- runFlow: subflows/open-jewelry.yaml
- runFlow:
    file: subflows/open-section.yaml
    env:
      ID: 'manage-staff'
- runFlow:
    file: subflows/scroll-form.yaml
    env:
      ID: 'staff-lock-minutes'
- tapOn:
    id: 'staff-lock-minutes'
- tapOn: '3 دقائق'
- tapOn:
    id: 'staff-warn-minutes'
- tapOn: 'دقيقة'
# The row reads «يُقفل بعد عدم الاستخدام، 3 دقائق» as one label.
- assertVisible: '.*3 دقائق.*'
- assertVisible: '.*قبل القفل، دقيقة'
- takeScreenshot: ${DEVICE}-auto-lock-settings
# Back to the top, where «إضافة موظف» is (on iPad the section stays where it was scrolled;
# with no employees yet it is the empty page's button, not the staff-add row).
- scrollUntilVisible:
    element:
      text: 'إضافة موظف'
    direction: UP
    timeout: 30000
- runFlow: subflows/add-employee.yaml
# Nothing touched from here: the warning after 2 minutes, the lock after 3.
- extendedWaitUntil:
    visible:
      id: 'idle-warning'
    timeout: 200000
- takeScreenshot: ${DEVICE}-auto-lock-warning
# Run 77: one long wait here gave up after about 10 seconds while the countdown was still running
# (0:48 left). Run 78: with the countdown on screen each wait below ends after about 3 seconds
# whatever its timeout, so 15 of them covered under a minute. Try up to 80 times: at least 3
# minutes at 2 to 3 seconds each (the lock is due 1 minute after the warning).
- repeat:
    times: 80
    while:
      notVisible:
        id: 'person-owner'
    commands:
      - extendedWaitUntil:
          visible:
            id: 'person-owner'
          timeout: 10000
          optional: true
- assertVisible:
    id: 'person-owner'
- assertVisible:
    id: 'person-سارة'
- takeScreenshot: ${DEVICE}-auto-lock-locked
