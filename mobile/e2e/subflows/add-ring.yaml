# Adds "Ring Zircon" (Pandora, 350 د.ل, cost 200, 3 in stock) from the Products tab.
appId: com.salford.pos
---
- runFlow:
    file: open-tab.yaml
    env:
      TAB: 'المنتجات'
- tapOn: 'إضافة قطعة'
- extendedWaitUntil:
    visible:
      id: 'product-name'
    timeout: 30000
- tapOn:
    id: 'product-name'
# Run 75 (iPad, first flow on a just-booted simulator): typed in one go, the cursor jumped back
# after «Ring» and the name was saved as «R Zirconing». Every multi-word text is now typed in
# two parts, so the app catches up at the space; then the field must show the whole name.
- inputText: 'Ring'
- inputText: ' Zircon'
- extendedWaitUntil:
    visible:
      id: 'product-name'
      text: 'Ring Zircon'
    timeout: 5000
# Closes the keyboard with the app's own \"تم\" bar (Maestro's hideKeyboard can't, since 2026).
- tapOn:
    id: 'keyboard.toolbar.done'
- tapOn:
    id: 'product-brand'
- inputText: 'Pandora'
# Closes the keyboard with the app's own \"تم\" bar (Maestro's hideKeyboard can't, since 2026).
- tapOn:
    id: 'keyboard.toolbar.done'
- runFlow:
    file: scroll-to-field.yaml
    env:
      ID: 'product-price'
- inputText: '350'
# Closes the keyboard with the app's own \"تم\" bar (Maestro's hideKeyboard can't, since 2026).
- tapOn:
    id: 'keyboard.toolbar.done'
- runFlow:
    file: scroll-to-field.yaml
    env:
      ID: 'product-cost'
- inputText: '200'
# Closes the keyboard with the app's own \"تم\" bar (Maestro's hideKeyboard can't, since 2026).
- tapOn:
    id: 'keyboard.toolbar.done'
- runFlow:
    file: scroll-to-field.yaml
    env:
      ID: 'product-stock'
- eraseText
- inputText: '3'
# Closes the keyboard with the app's own \"تم\" bar (Maestro's hideKeyboard can't, since 2026).
- tapOn:
    id: 'keyboard.toolbar.done'
- runFlow:
    file: scroll-form.yaml
    env:
      ID: 'product-save'
- tapOn:
    id: 'product-save'
- extendedWaitUntil:
    visible: '.*Ring Zircon.*'
    timeout: 30000
