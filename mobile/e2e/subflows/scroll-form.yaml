# Scrolls the product form until the element with id ${ID} shows, swiping in the middle of the
# form: a sheet on iPhone, a window centred over the product cards on iPad.
appId: com.salford.pos
---
- repeat:
    times: 8
    while:
      notVisible:
        id: ${ID}
    commands:
      - swipe:
          start: 50%, 75%
          end: 50%, 45%
          duration: 600
