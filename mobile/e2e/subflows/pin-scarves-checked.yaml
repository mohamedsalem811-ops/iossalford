# Types the scarves PIN (pin-scarves.yaml) during the first-launch setup and checks that all 8 digits
# arrived; if one did not, clears the pad and types the PIN again.
# Run 71 (iPhone, loyalty-points): the device log shows the simulator lost the release of one tap
# ("contact 2 presence: touching" with no "presence: none"); a key only counts on release, so the
# pad showed 7 of 8 and «أكّد الرمز» never came, although Maestro reported all 8 taps done.
# The check reads the dots' label with copyTextFrom and decides in JavaScript: no `when: visible`
# wait (those cost up to 7 seconds each when false, run 68). After a complete PIN the screen
# shows a new, empty pad (0 of 8) or the system choice (اختر النظام); after a lost tap, 1 to 7.
appId: com.salford.pos
---
- runFlow: pin-scarves.yaml
# Run 64: the dots can read short for a moment while the screen is already moving on.
- waitForAnimationToEnd:
    timeout: 3000
- copyTextFrom:
    text: 'تم إدخال [0-8] من 8|اختر النظام'
- runFlow:
    when:
      true: '${/[1-7] من 8$/.test(maestro.copiedText)}'
    commands:
      - takeScreenshot: ${DEVICE}-pin-tap-lost
      - repeat:
          while:
            notVisible: 'تم إدخال 0 من 8'
          times: 8
          commands:
            - tapOn:
                id: 'pin-key-del'
      - runFlow: pin-scarves.yaml
