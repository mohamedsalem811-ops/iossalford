# On the return form (jewelry): both conditions answered "yes" and a photo of the piece chosen
# from the simulator's photo library (S4 rules: a return needs both). Ends with the photo shown.
# Apple's photo picker runs outside the app: Maestro sees none of it (not even its photos), and
# none of the app's screen while it is open. So a photo is tapped where it shows: iPad (run 55)
# 6 in a row right of the picker's sidebar, the first at 41%, 15%; iPhone (run 57) 3 in a row
# under its title, the second at 45%, 24%.
# Run 57: twice in three picks on iPhone, the picker closed without handing the photo to the app
# (the simulator's log shows no export of the photo), so the photo never came. The app keeps its
# buttons usable while a pick waits, and a new pick replaces it: here the photo is picked again,
# up to twice, if it hasn't come within 30 seconds.
appId: com.salford.pos
---
- tapOn:
    id: 'cond-yes-0'
- tapOn:
    id: 'cond-yes-1'
- runFlow:
    file: scroll-form.yaml
    env:
      ID: 'photo-library'
- runFlow:
    file: pick-photo.yaml
- extendedWaitUntil:
    visible: 'حذف الصورة'
    timeout: 30000
    optional: true
- repeat:
    while:
      notVisible: 'حذف الصورة'
    times: 2
    commands:
      - runFlow:
          file: pick-photo.yaml
      - extendedWaitUntil:
          visible: 'حذف الصورة'
          timeout: 30000
          optional: true
- assertVisible: 'حذف الصورة'
- takeScreenshot: ${DEVICE}-return-photo-chosen
