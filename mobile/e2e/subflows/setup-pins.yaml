# First launch: creates both PINs (each entered twice) and lands on the system choice.
# Run 71 (iPhone): the simulator lost one tap here (7 of 8 dots) and the flow stopped. Each entry
# is now followed by the same retry as at sign-in (pin-retry.yaml, passed in every run): only when
# the dots show 1 to 7 of 8 is the entry cleared and typed again.
appId: com.salford.pos
---
- assertVisible: 'أنشئ رمز نظام المجوهرات'
- runFlow: pin-jewelry.yaml
- runFlow: pin-retry.yaml
- assertVisible: 'أكّد الرمز'
- runFlow: pin-jewelry.yaml
- runFlow: pin-retry.yaml
- assertVisible: 'أنشئ رمز نظام الأوشحة'
- runFlow: pin-scarves.yaml
- runFlow: pin-retry-scarves.yaml
- assertVisible: 'أكّد الرمز'
- runFlow: pin-scarves.yaml
- runFlow: pin-retry-scarves.yaml
- assertVisible: 'اختر النظام'
