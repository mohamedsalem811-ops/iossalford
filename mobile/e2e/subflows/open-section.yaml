# Opens a Management section by its row (id ${ID}, like manage-expenses), from wherever the app is.
# iPad: the menu is the column on the right (from 60% across) and the section fills the rest;
# scrollUntilVisible swipes the middle of the screen, outside the menu, so the menu is swiped at
# 85% across. The menu is taller than the screen: a row cut by the bottom edge counts as visible
# but its middle is off the screen, so the menu is scrolled until the row has another menu row
# below it (Maestro leaves out rows wholly off the screen), or to its end for the last row.
# iPhone: the row is brought above 70% of the screen height: a row left at the bottom is under
# the floating tab bar, and a tap there lands on a tab. The last rows (lock, switch system) can't
# go that high: Maestro tries 5 times (about 4 seconds each), then takes them where they are, so
# the scroll has 60 seconds (its 20-second default ran out first in run 57).
appId: com.salford.pos
---
- runFlow: management-menu.yaml
- runFlow:
    when:
      true: ${DEVICE == 'iPad'}
    commands:
      - repeat:
          while:
            notVisible:
              id: ${ID}
              above:
                id: 'manage-(?!sidebar).+'
          times: 4
          commands:
            - swipe:
                start: 85%, 75%
                end: 85%, 35%
                duration: 400
- runFlow:
    when:
      true: ${DEVICE != 'iPad'}
    commands:
      - scrollUntilVisible:
          element:
            id: ${ID}
          direction: DOWN
          centerElement: true
          timeout: 60000
- tapOn:
    id: ${ID}
