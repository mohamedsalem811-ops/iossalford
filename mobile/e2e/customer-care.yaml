# Phase G3. A customer with a birthday today and a wanted piece: the home screen lists the
# birthday; Customers → متابعة الزبائن shows it, with "المكررون" and the owner's
# report; adding a matching piece reminds who wanted it.
appId: com.salford.pos
---
- runFlow: subflows/open-jewelry.yaml
# Today's day and month, so the birthday is always this week.
- evalScript: ${output.day = String(new Date().getDate()); output.month = String(new Date().getMonth() + 1)}
- runFlow:
    file: subflows/open-section.yaml
    env:
      ID: 'manage-customers'
- runFlow:
    file: subflows/toolbar-button.yaml
    env:
      LABEL: 'زبون جديد'
- tapOn:
    id: 'customer-name'
- inputText: 'Noor'
- tapOn:
    id: 'keyboard.toolbar.done'
- runFlow:
    file: subflows/scroll-to-field.yaml
    env:
      ID: 'customer-details-birth-day'
- inputText: ${output.day}
- tapOn:
    id: 'keyboard.toolbar.done'
- tapOn:
    id: 'customer-details-birth-month'
- inputText: ${output.month}
- tapOn:
    id: 'keyboard.toolbar.done'
- runFlow:
    file: subflows/scroll-form.yaml
    env:
      ID: 'customer-save'
- tapOn:
    id: 'customer-save'
- tapOn:
    id: 'customer-Noor'
- runFlow:
    file: subflows/scroll-form.yaml
    env:
      ID: 'wanted-add'
- tapOn:
    id: 'wanted-add'
# Run 64: the text was typed before the prompt was up. Wait for it; the saved row reads with its date.
- extendedWaitUntil:
    visible: 'قطعة يطلبها الزبون'
    timeout: 10000
- inputText: 'سوار ذهب'
- tapOn: 'حفظ'
- extendedWaitUntil:
    visible: '.*سوار ذهب.*'
    timeout: 10000
- takeScreenshot: ${DEVICE}-customer-wanted
# iPad: from the home screen's «أعياد ميلاد هذا الأسبوع» row (attention-birthdays), which opens the
# same page. Run 68 (iPad) failed opening it from the customers' «More» menu: after the back button
# «More» was opened and «متابعة الزبائن» was not found (only the job's console line was kept, so
# what the menu showed is unknown). This way does not use that menu: the home tab (open-tab) and
# the «يحتاج انتباهك» card (sale.yaml finds its debts row there) pass on iPad.
- runFlow:
    when:
      true: ${DEVICE == 'iPad'}
    commands:
      - runFlow:
          file: subflows/open-tab.yaml
          env:
            TAB: 'الرئيسية'
      - runFlow:
          file: subflows/scroll-form.yaml
          env:
            ID: 'attention-birthdays'
      # A list row reads as its title alone (list-group.tsx), «أعياد ميلاد هذا الأسبوع: 1».
      - assertVisible:
          id: 'attention-birthdays'
          text: 'أعياد ميلاد هذا الأسبوع: 1'
      - tapOn:
          id: 'attention-birthdays'
# iPhone: the customers' toolbar button, back to the list by the back button's id (passed in run 68).
- runFlow:
    when:
      true: ${DEVICE != 'iPad'}
    commands:
      - tapOn:
          id: 'BackButton'
      - extendedWaitUntil:
          visible:
            id: 'customer-Noor'
          timeout: 15000
      - runFlow:
          file: subflows/toolbar-button.yaml
          env:
            LABEL: 'متابعة الزبائن'
- extendedWaitUntil:
    visible: 'أعياد ميلاد هذا الأسبوع'
    timeout: 15000
- assertVisible: 'أعياد ميلاد هذا الأسبوع'
- takeScreenshot: ${DEVICE}-care-birthdays
- tapOn: 'التقرير'
- assertVisible: 'الزبائن العائدون'
- takeScreenshot: ${DEVICE}-care-report
# «لم يعودوا» moved to Marketing → «نفتقدك», with a real offer.
- tapOn: 'نفتقدك ←'
- extendedWaitUntil:
    visible:
      id: 'marketing-offer-percent'
    timeout: 10000
