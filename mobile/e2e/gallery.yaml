# Phase 1: the design gallery in both systems and both modes. Opened by its link only.
appId: com.salford.pos
---
- runFlow: subflows/fresh-launch.yaml
- openLink: salfordpos://gallery
# iOS may ask before opening the app's own link.
- runFlow:
    when:
      visible: 'Open'
    commands:
      - tapOn: 'Open'
# The CI simulator has taken from 19 to 90 seconds to hand the link to the app after "Open".
- extendedWaitUntil:
    visible: 'مبيعات اليوم'
    timeout: 180000
- assertVisible: 'SALFORD jewelry'
- takeScreenshot: ${DEVICE}-gallery-jewelry-light
- waitForAnimationToEnd
- tapOn:
    text: 'داكن'
    retryTapIfNoChange: true
- takeScreenshot: ${DEVICE}-gallery-jewelry-dark
- waitForAnimationToEnd
- tapOn:
    text: 'الأوشحة'
    retryTapIfNoChange: true
- assertVisible: 'SALFORD scarfs'
- takeScreenshot: ${DEVICE}-gallery-scarves-dark
- waitForAnimationToEnd
- tapOn:
    text: 'فاتح'
    retryTapIfNoChange: true
- takeScreenshot: ${DEVICE}-gallery-scarves-light
- scrollUntilVisible:
    element: 'الأزرار'
    direction: DOWN
    centerElement: true
- takeScreenshot: ${DEVICE}-gallery-scarves-light-components
- scrollUntilVisible:
    element:
      id: 'gallery-open-sheet'
    direction: DOWN
    centerElement: true
- tapOn:
    id: 'gallery-open-sheet'
- assertVisible: 'نافذة منبثقة'
- takeScreenshot: ${DEVICE}-gallery-sheet
