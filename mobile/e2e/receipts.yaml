# Phase 6: the receipt of a sale in the Receipts tab (on iPad, beside the list).
appId: com.salford.pos
---
- runFlow: subflows/open-jewelry.yaml
- runFlow: subflows/add-ring.yaml
- runFlow: subflows/sell-ring.yaml
- tapOn:
    id: 'sold-new-sale'
- runFlow:
    file: subflows/open-tab.yaml
    env:
      TAB: 'الإيصالات'
- extendedWaitUntil:
    visible:
      id: 'receipts-summary'
    timeout: 30000
- assertVisible: '1 إيصال'
- takeScreenshot: ${DEVICE}-receipts
- tapOn:
    text: 'GR-.*'
- runFlow:
    when:
      visible:
        id: 'receipt-pane'
    commands:
      # 10.0: run 76 showed the preview still white at this moment; wait for the page itself
      # (the A4 receipt's own words, drawn inside the preview) before the picture.
      - extendedWaitUntil:
          visible: 'Receipt No:'
          timeout: 30000
      - takeScreenshot: ${DEVICE}-receipt-beside-list
- runFlow:
    when:
      visible:
        id: 'studio-number'
    commands:
      - takeScreenshot: ${DEVICE}-receipt-opened
