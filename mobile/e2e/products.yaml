# Phase 4: adding a piece with a new brand, the list and its brand filter, then the brands screen.
# On iPad the pieces are photo cards and the form opens as a window over them; the steps are the same.
appId: com.salford.pos
---
- runFlow: subflows/fresh-launch.yaml
- runFlow: subflows/setup-pins.yaml
- tapOn: 'نظام المجوهرات'
- runFlow: subflows/pin-jewelry.yaml
# The first Face ID check on a fresh CI simulator can hold the PIN check for 30 seconds or more.
- extendedWaitUntil:
    visible: 'مبيعات اليوم'
    timeout: 90000
- runFlow:
    file: subflows/open-tab.yaml
    env:
      TAB: 'المنتجات'
- extendedWaitUntil:
    visible: 'لا توجد قطع بعد'
    timeout: 30000
- takeScreenshot: ${DEVICE}-products-empty
- tapOn: 'إضافة قطعة'
- extendedWaitUntil:
    visible:
      id: 'product-name'
    timeout: 30000
- tapOn:
    id: 'product-name'
- inputText: 'Ring'
- inputText: ' Zircon'
# Closes the keyboard with the app's own \"تم\" bar (Maestro's hideKeyboard can't, since 2026).
- tapOn:
    id: 'keyboard.toolbar.done'
- tapOn:
    id: 'product-brand'
- inputText: 'Pandora'
# Closes the keyboard with the app's own \"تم\" bar (Maestro's hideKeyboard can't, since 2026).
- tapOn:
    id: 'keyboard.toolbar.done'
- assertVisible: 'ماركة جديدة — ستُضاف للقائمة عند الحفظ'
- runFlow:
    file: subflows/scroll-to-field.yaml
    env:
      ID: 'product-price'
- inputText: '350'
# Closes the keyboard with the app's own \"تم\" bar (Maestro's hideKeyboard can't, since 2026).
- tapOn:
    id: 'keyboard.toolbar.done'
- runFlow:
    file: subflows/scroll-to-field.yaml
    env:
      ID: 'product-cost'
- inputText: '200'
# Closes the keyboard with the app's own \"تم\" bar (Maestro's hideKeyboard can't, since 2026).
- tapOn:
    id: 'keyboard.toolbar.done'
- repeat:
    times: 8
    while:
      notVisible: '150 د.ل • 43٪'
    commands:
      - swipe:
          start: 50%, 75%
          end: 50%, 45%
          duration: 600
- takeScreenshot: ${DEVICE}-product-form
- runFlow:
    file: subflows/scroll-form.yaml
    env:
      ID: 'product-save'
- tapOn:
    id: 'product-save'
- extendedWaitUntil:
    visible: '.*Ring Zircon.*'
    timeout: 30000
- assertVisible: '.*RNG-0001 • خواتم.*'
- assertVisible: '1 صنف • 1 قطعة في المخزن'
- takeScreenshot: ${DEVICE}-products-list
# One tap on the brand shows its pieces; a second tap shows all again.
- tapOn:
    id: 'brand-chip-Pandora'
- assertVisible: '.*Ring Zircon.*'
- tapOn:
    id: 'brand-chip-Pandora'
# Management → Brands lists the brand added with the piece.
- runFlow:
    file: subflows/open-section.yaml
    env:
      ID: 'manage-brands'
- extendedWaitUntil:
    visible:
      id: 'brand-row-Pandora'
    timeout: 30000
- assertVisible: 'الماركات \(1\)'
- takeScreenshot: ${DEVICE}-brands
# The full check before 10.0: the piece's long-press menu. The stock sheet with a reason (1 → 2).
- runFlow:
    file: subflows/open-tab.yaml
    env:
      TAB: 'المنتجات'
- longPressOn: '.*Ring Zircon.*'
- tapOn: 'تعديل المخزون مع السبب'
- extendedWaitUntil:
    visible:
      id: 'stock-quantity'
    timeout: 30000
- tapOn: 'توريد جديد'
- assertVisible: 'سيصبح المخزون: 2 قطعة'
- takeScreenshot: ${DEVICE}-stock-sheet
- tapOn:
    id: 'stock-save'
- extendedWaitUntil:
    notVisible:
      id: 'stock-quantity'
    timeout: 30000
# The original invoices (jewelry, the owner): none yet, the button to add one.
- longPressOn: '.*Ring Zircon.*'
- tapOn: 'الفاتورة الأصلية'
- extendedWaitUntil:
    visible:
      id: 'invoice-add'
    timeout: 30000
- takeScreenshot: ${DEVICE}-invoices
- runFlow:
    file: subflows/toolbar-button.yaml
    env:
      LABEL: 'إغلاق'
# A photo from the library, then the photo viewer from the menu.
- tapOn: '.*Ring Zircon.*'
- extendedWaitUntil:
    visible:
      id: 'product-name'
    timeout: 30000
- runFlow:
    file: subflows/scroll-form.yaml
    env:
      ID: 'photo-library'
- runFlow: subflows/pick-photo.yaml
- extendedWaitUntil:
    visible: 'حذف الصورة'
    timeout: 30000
    optional: true
- repeat:
    while:
      notVisible: 'حذف الصورة'
    times: 2
    commands:
      - runFlow: subflows/pick-photo.yaml
      - extendedWaitUntil:
          visible: 'حذف الصورة'
          timeout: 30000
          optional: true
- assertVisible: 'حذف الصورة'
- runFlow:
    file: subflows/scroll-form.yaml
    env:
      ID: 'product-save'
- tapOn:
    id: 'product-save'
- extendedWaitUntil:
    visible: '.*Ring Zircon.*'
    timeout: 30000
- longPressOn: '.*Ring Zircon.*'
- tapOn: 'عرض الصورة'
- extendedWaitUntil:
    visible: 'تغيير الصورة أو تعديل بيانات القطعة'
    timeout: 30000
- takeScreenshot: ${DEVICE}-product-photo
- runFlow:
    file: subflows/toolbar-button.yaml
    env:
      LABEL: 'إغلاق'
