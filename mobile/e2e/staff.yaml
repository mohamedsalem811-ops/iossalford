# Phase S1: the owner adds an employee; she signs in with the temporary PIN, chooses her own,
# and doesn't see the staff screen. iPhone and iPad (screens: staff list, name cards).
appId: com.salford.pos
---
- runFlow: subflows/open-jewelry.yaml
- runFlow:
    file: subflows/open-section.yaml
    env:
      ID: 'manage-staff'
- assertVisible: 'لا يوجد موظفون بعد'
- takeScreenshot: ${DEVICE}-staff-empty
- tapOn: 'إضافة موظف'
- inputText: 'سارة'
- tapOn: 'التالي'
- inputText: '147036'
- tapOn: 'حفظ'
- assertVisible:
    id: 'staff-سارة'
- takeScreenshot: ${DEVICE}-staff-list
# Switch user: the name cards appear.
- runFlow:
    file: subflows/open-section.yaml
    env:
      ID: 'manage-lock'
- assertVisible: 'من يستخدم النظام؟'
- takeScreenshot: ${DEVICE}-sign-in-people
- tapOn:
    id: 'person-سارة'
- tapOn:
    id: 'pin-key-1'
- tapOn:
    id: 'pin-key-4'
- tapOn:
    id: 'pin-key-7'
- tapOn:
    id: 'pin-key-0'
- tapOn:
    id: 'pin-key-3'
- tapOn:
    id: 'pin-key-6'
- assertVisible: 'سارة: اختر رمزك'
- runFlow: subflows/pin-sara.yaml
- runFlow: subflows/pin-sara.yaml
- extendedWaitUntil:
    visible: 'أهلاً، سارة'
    timeout: 30000
# An employee does not see the staff screen.
- tapOn: 'الإدارة'
- assertNotVisible:
    id: 'manage-staff'
- takeScreenshot: ${DEVICE}-employee-management
