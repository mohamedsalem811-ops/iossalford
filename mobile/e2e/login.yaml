# Phase 3: create both PINs, a wrong PIN, the right PIN, then every tab.
appId: com.salford.pos
---
- runFlow: subflows/fresh-launch.yaml
- runFlow: subflows/setup-pins.yaml
- takeScreenshot: ${DEVICE}-chooser
- tapOn: 'نظام المجوهرات'
- assertVisible: 'أدخل رمز الدخول'
- takeScreenshot: ${DEVICE}-login-jewelry
- runFlow: subflows/pin-wrong.yaml
# The first Face ID check on a fresh CI simulator can hold the PIN check for 30 seconds or more.
- extendedWaitUntil:
    visible: 'رمز خاطئ، بقيت 4 محاولات قبل القفل المؤقت'
    timeout: 90000
- runFlow: subflows/pin-jewelry.yaml
- extendedWaitUntil:
    visible: 'مبيعات اليوم'
    timeout: 90000
- takeScreenshot: ${DEVICE}-dashboard-jewelry
- tapOn: 'بيع'
- assertVisible: 'لا توجد منتجات للبيع بعد'
- tapOn: 'المنتجات'
- extendedWaitUntil:
    visible: 'لا توجد قطع بعد'
    timeout: 30000
- tapOn: 'الإيصالات'
- assertVisible: 'لا توجد إيصالات بعد'
- tapOn: 'الإدارة'
- scrollUntilVisible:
    element: 'قفل النظام'
    direction: DOWN
- takeScreenshot: ${DEVICE}-management-jewelry
# The lock button shows the login again in place of the screens.
- tapOn: 'قفل النظام'
- assertVisible: 'أدخل رمز الدخول'
