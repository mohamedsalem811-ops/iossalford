# Phase S4: the owner's rules, a discount over the limit approved on the spot, and a return with
# its photo and conditions. The owner sets the limits (10 د.ل a piece, 20 a sale) and adds Ring
# Zircon and سارة; she sells it 50 below its price, gives a reason and the owner types his PIN;
# then she takes it back. iPhone and iPad (screens: rules, approval, return form).
appId: com.salford.pos
---
- runFlow: subflows/open-jewelry.yaml
- runFlow: subflows/add-ring.yaml
- runFlow:
    file: subflows/open-section.yaml
    env:
      ID: 'manage-policies'
- tapOn:
    id: 'policy-piece'
- eraseText
- inputText: '10'
- tapOn:
    id: 'keyboard.toolbar.done'
- tapOn:
    id: 'policy-sale'
- eraseText
- inputText: '20'
- tapOn:
    id: 'keyboard.toolbar.done'
- runFlow:
    file: subflows/scroll-form.yaml
    env:
      ID: 'policy-save'
- tapOn:
    id: 'policy-save'
- assertVisible: 'تم الحفظ'
- tapOn: 'OK'
- takeScreenshot: ${DEVICE}-policies
- runFlow: subflows/add-employee.yaml
- runFlow: subflows/open-shift.yaml
# 300 instead of 350: over her limit, so the owner approves.
- tapOn: 'بيع'
- tapOn:
    id: 'sale-tile-Ring Zircon'
- runFlow:
    when:
      visible:
        id: 'cart-bar'
    commands:
      - tapOn:
          id: 'cart-bar'
- tapOn:
    id: 'cart-price-Ring Zircon'
- eraseText
- inputText: '300'
- tapOn: 'حفظ'
- tapOn:
    id: 'cart-checkout'
- assertVisible: '.*يحتاج موافقة المالك'
- takeScreenshot: ${DEVICE}-discount-needs-owner
- tapOn:
    id: 'checkout-confirm'
- tapOn: 'زبون دائم'
- inputText: '19283746'
- tapOn: 'موافقة'
- extendedWaitUntil:
    visible:
      id: 'sold-title'
    timeout: 30000
- tapOn:
    id: 'sold-new-sale'
# The return of that sale: the conditions and a photo.
- runFlow:
    file: subflows/open-section.yaml
    env:
      ID: 'manage-returnFind'
- tapOn:
    id: 'return-find-text'
- inputText: '1'
- tapOn:
    id: 'return-find'
- tapOn:
    id: 'return-line-.*'
    index: 0
- assertVisible:
    id: 'return-refund-fixed'
- runFlow: subflows/return-photo.yaml
- takeScreenshot: ${DEVICE}-return-form
- tapOn:
    id: 'return-save'
- extendedWaitUntil:
    notVisible:
      id: 'return-save'
    timeout: 15000
