# Phase S4: the owner's rules, a discount over the limit approved on the spot, and a return with
# its photo and conditions. Runs after staff-log.yaml (the owner is signed in, سارة has sold the
# Ring). iPhone and iPad, light and dark (screens: rules, approval, return form, account).
appId: com.salford.pos
---
# The owner sets the limits: 10 د.ل per piece, 20 per sale, returns within 24 hours.
- tapOn: 'الإدارة'
- scrollUntilVisible:
    element:
      id: 'manage-policies'
    direction: DOWN
- tapOn:
    id: 'manage-policies'
- tapOn:
    id: 'policy-piece'
- inputText: '10'
- tapOn:
    id: 'policy-sale'
- inputText: '20'
- tapOn:
    id: 'policy-save'
- assertVisible: 'تم الحفظ'
- tapOn: 'حسناً'
- takeScreenshot: ${DEVICE}-policies
# سارة sells the Ring 50 د.ل below its price: the reason, then the owner's PIN.
- tapOn: 'الإدارة'
- scrollUntilVisible:
    element:
      id: 'manage-lock'
    direction: DOWN
- tapOn:
    id: 'manage-lock'
- tapOn:
    id: 'person-سارة'
- tapOn:
    id: 'pin-key-9'
- tapOn:
    id: 'pin-key-6'
- tapOn:
    id: 'pin-key-3'
- tapOn:
    id: 'pin-key-2'
- tapOn:
    id: 'pin-key-5'
- tapOn:
    id: 'pin-key-8'
- extendedWaitUntil:
    visible: 'أهلاً، سارة'
    timeout: 30000
- runFlow: subflows/add-ring.yaml
- tapOn: 'السلة'
- longPressOn: 'Ring'
- tapOn: 'تغيير السعر'
- eraseText
- inputText: '300'
- tapOn: 'حفظ'
- tapOn: 'إتمام البيع'
- assertVisible: '.*يحتاج موافقة المالك'
- takeScreenshot: ${DEVICE}-discount-needs-owner
- tapOn:
    id: 'checkout-confirm'
- tapOn: 'زبون دائم'
- inputText: '19283746'
- tapOn: 'موافقة'
- extendedWaitUntil:
    visible: 'تم البيع'
    timeout: 15000
- tapOn:
    id: 'sold-new-sale'
# A return of that sale: the conditions and a photo from the library.
- tapOn: 'الإدارة'
- tapOn:
    id: 'manage-returnFind'
- tapOn:
    id: 'return-find-text'
- inputText: '2'
- tapOn:
    id: 'return-find'
- tapOn:
    id: 'return-line-.*'
- tapOn:
    id: 'cond-yes-0'
- tapOn:
    id: 'cond-yes-1'
- assertVisible:
    id: 'return-refund-fixed'
- tapOn: 'الألبوم'
- tapOn:
    index: 0
    text: '.*Photo.*'
- takeScreenshot: ${DEVICE}-return-form
- tapOn:
    id: 'return-save'
