# Using a customer's credit at checkout (review fix 2): Sara buys Ring Zircon on credit with her
# phone, pays it all, then returns it, so the shop owes her 350. At the next checkout her phone
# shows "له رصيد 350"; "استخدام رصيده لهذا البيع" sells the ring again from that credit, and her
# balance ends at zero.
appId: com.salford.pos
---
- runFlow: subflows/open-jewelry.yaml
- runFlow: subflows/add-ring.yaml
- tapOn: 'بيع'
- tapOn:
    id: 'sale-tile-Ring Zircon'
- runFlow:
    when:
      visible:
        id: 'cart-bar'
    commands:
      - tapOn:
          id: 'cart-bar'
- tapOn:
    id: 'cart-checkout'
- tapOn: 'آجل'
- tapOn:
    id: 'checkout-phone'
- inputText: '0912345678'
- tapOn:
    id: 'keyboard.toolbar.done'
- tapOn:
    id: 'checkout-name'
- inputText: 'Sara'
- tapOn:
    id: 'keyboard.toolbar.done'
- tapOn:
    id: 'checkout-confirm'
- extendedWaitUntil:
    visible:
      id: 'sold-title'
    timeout: 30000
- tapOn:
    id: 'sold-new-sale'
# She pays it all.
- runFlow:
    file: subflows/open-section.yaml
    env:
      ID: 'manage-customers'
- tapOn:
    id: 'customer-Sara'
- tapOn:
    id: 'customer-pay'
- tapOn:
    id: 'payment-save'
# She returns it: the refund becomes her credit.
- runFlow:
    file: subflows/open-section.yaml
    env:
      ID: 'manage-returnFind'
- tapOn:
    id: 'return-find-text'
- inputText: '1'
- tapOn:
    id: 'return-find'
- tapOn:
    id: 'return-line-.*'
    index: 0
- runFlow: subflows/return-photo.yaml
- tapOn:
    id: 'return-save'
# The next sale uses the credit.
- tapOn: 'بيع'
- tapOn:
    id: 'sale-tile-Ring Zircon'
- runFlow:
    when:
      visible:
        id: 'cart-bar'
    commands:
      - tapOn:
          id: 'cart-bar'
- tapOn:
    id: 'cart-checkout'
- tapOn:
    id: 'checkout-phone'
- inputText: '0912345678'
- tapOn:
    id: 'keyboard.toolbar.done'
- assertVisible: '.*له رصيد 350.*'
- tapOn:
    id: 'checkout-use-credit'
- assertVisible:
    id: 'checkout-credit-use'
- takeScreenshot: ${DEVICE}-use-credit
- tapOn:
    id: 'checkout-confirm'
- extendedWaitUntil:
    visible:
      id: 'sold-title'
    timeout: 30000
- tapOn:
    id: 'sold-new-sale'
- runFlow:
    file: subflows/open-section.yaml
    env:
      ID: 'manage-customers'
- tapOn:
    id: 'customer-Sara'
- assertVisible: 'لا ديون'
