# K10: the owner chooses the emergency password (letters and digits), confirmed with the owner's
# PIN; a forgotten owner PIN opens with it; 3 wrong PINs bring «نسيت الرمز؟» forward. Not run
# until the owner says so.
appId: com.salford.pos
---
- runFlow: subflows/open-jewelry.yaml
- runFlow:
    file: subflows/open-section.yaml
    env:
      ID: 'manage-staff'
- assertVisible:
    id: 'staff-emergency'
- takeScreenshot: ${DEVICE}-emergency-none
- tapOn:
    id: 'staff-emergency'
# The owner confirms with the PIN (the approval prompt).
- inputText: '19283746'
- tapOn: 'موافقة'
- inputText: 'Mona2026Salem'
- tapOn: 'التالي'
- inputText: 'Mona2026Salem'
- tapOn: 'حفظ'
- extendedWaitUntil:
    visible: 'حُفظت كلمة سر الطوارئ'
    timeout: 30000
- tapOn: 'حسناً'
- assertVisible: 'محفوظة'
- takeScreenshot: ${DEVICE}-emergency-saved
# Locked out of the PIN: 3 wrong PINs, then the emergency password.
- runFlow:
    file: subflows/open-section.yaml
    env:
      ID: 'manage-lock'
- runFlow: subflows/pin-wrong.yaml
- runFlow: subflows/pin-wrong.yaml
- runFlow: subflows/pin-wrong.yaml
- extendedWaitUntil:
    visible:
      id: 'login-forgot-hint'
    timeout: 30000
- takeScreenshot: ${DEVICE}-forgot-hint
- tapOn:
    id: 'login-forgot'
- tapOn:
    id: 'emergency-code'
- inputText: 'mona2026salem'
- tapOn:
    id: 'emergency-check'
- assertVisible: 'رمز جديد للمالك'
- runFlow: subflows/pin-jewelry.yaml
- runFlow: subflows/pin-jewelry.yaml
- extendedWaitUntil:
    visible: 'مبيعات اليوم'
    timeout: 90000
