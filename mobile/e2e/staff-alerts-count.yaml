# Phase S6: the owner's alerts, the blind stock count and the device guide. سارة closes her
# shift 100 short, then counts Ring Zircon at 0 without seeing its stock; the owner sees the
# shortage alert and marks it seen, applies the count's difference, then opens the guide.
# iPhone and iPad (screens: alerts, count sheet, count result, guide).
appId: com.salford.pos
---
- runFlow: subflows/open-jewelry.yaml
- runFlow: subflows/add-ring.yaml
- runFlow: subflows/add-employee.yaml
- runFlow: subflows/open-shift.yaml
# She closes with nothing counted: 100 short.
- runFlow:
    file: subflows/scroll-form.yaml
    env:
      ID: 'shift-counted'
- tapOn:
    id: 'shift-counted'
- inputText: '0'
- tapOn:
    id: 'keyboard.toolbar.done'
- runFlow:
    file: subflows/scroll-form.yaml
    env:
      ID: 'shift-close'
- tapOn:
    id: 'shift-close'
- tapOn: 'إغلاق'
- assertVisible:
    id: 'shift-difference'
# She counts the Ring: 0 (the owner sees the real difference).
- runFlow:
    file: subflows/open-section.yaml
    env:
      ID: 'manage-stockCount'
- tapOn:
    id: 'count-start'
- assertVisible:
    id: 'count-open'
- tapOn:
    id: 'count-row-[0-9]+'
    index: 0
- inputText: '0'
- tapOn: 'حفظ'
- assertVisible:
    id: 'count-progress'
- takeScreenshot: ${DEVICE}-count-sheet
- tapOn:
    id: 'count-submit'
- tapOn: 'إنهاء وإرسال'
- assertVisible:
    id: 'count-start'
# The owner: the shortage alert on the home screen, marked seen.
- runFlow: subflows/sign-in-owner.yaml
- assertVisible:
    id: 'alert-shortage'
- takeScreenshot: ${DEVICE}-alerts
- tapOn:
    id: 'alert-shortage'
- tapOn: 'اطلعت'
- assertNotVisible:
    id: 'alert-shortage'
# The count's result, applied.
- runFlow:
    file: subflows/open-section.yaml
    env:
      ID: 'manage-stockCount'
- tapOn:
    id: 'count-[0-9]+'
    index: 0
- assertVisible:
    id: 'count-summary'
- takeScreenshot: ${DEVICE}-count-result
- tapOn:
    id: 'count-apply'
- tapOn: 'تطبيق'
- assertVisible: 'طُبّق'
# The device guide.
- runFlow:
    file: subflows/open-section.yaml
    env:
      ID: 'manage-deviceGuide'
- assertVisible: 'الوصول الموجّه: يبقى الموظف داخل التطبيق'
- takeScreenshot: ${DEVICE}-device-guide
