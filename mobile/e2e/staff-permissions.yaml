# Phase S2: what an employee sees. The owner adds Ring Zircon and سارة; she opens a shift and
# sells; her home shows only her own sales; Management lists only what she may open; products
# show no cost; her sale shows no cost, profit or delete. iPhone and iPad (screens: home,
# Management, products, sale).
appId: com.salford.pos
---
- runFlow: subflows/open-jewelry.yaml
- runFlow: subflows/add-ring.yaml
- runFlow: subflows/add-employee.yaml
- assertNotVisible: '.*الربح.*'
- assertNotVisible:
    id: 'quick-product'
- takeScreenshot: ${DEVICE}-employee-home
# Management: no expenses, backups or returns list.
- runFlow: subflows/management-menu.yaml
- assertVisible:
    id: 'manage-sales'
- assertNotVisible:
    id: 'manage-expenses'
- assertNotVisible:
    id: 'manage-backup'
- assertNotVisible:
    id: 'manage-returns'
- takeScreenshot: ${DEVICE}-employee-management-s2
# Selling needs an open shift (phase S5).
- runFlow: subflows/open-shift.yaml
# Products: price and stock, no cost.
- tapOn: 'المنتجات'
- assertNotVisible: '.*تكلفة.*'
- takeScreenshot: ${DEVICE}-employee-products
# A sale, then its details: no cost, profit or delete.
- runFlow: subflows/sell-ring.yaml
- tapOn:
    id: 'sold-new-sale'
- runFlow:
    file: subflows/open-section.yaml
    env:
      ID: 'manage-sales'
- tapOn:
    index: 0
    id: 'sale-[0-9]+'
- assertNotVisible: '.*التكلفة.*'
- assertNotVisible:
    id: 'sale-delete'
- takeScreenshot: ${DEVICE}-employee-sale
