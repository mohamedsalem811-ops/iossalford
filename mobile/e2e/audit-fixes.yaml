# Audit fixes, batch 1: a kept cart at a changed price (F-1) and deleting a sale (F-2).
# A fresh install: Ring Zircon goes into the cart at 350, its price becomes 300, and checkout
# refuses the old price until "تحديث الأسعار"; the sale is then deleted, keeping its receipt.
appId: com.salford.pos
---
- runFlow: subflows/open-jewelry.yaml
- runFlow: subflows/add-ring.yaml
- tapOn: 'بيع'
- tapOn:
    id: 'sale-tile-Ring Zircon'
# The tile then shows 2 of the 3 free. Run 65 (iPad): the touch reached the app but the cart was
# empty at checkout (the same code passed runs 61 and 64). If the piece is not in the cart, a
# screenshot is kept to show it and the tile tapped once more.
- extendedWaitUntil:
    visible: '.*متوفر 2.*'
    timeout: 5000
    optional: true
- runFlow:
    when:
      notVisible: '.*متوفر 2.*'
    commands:
      - takeScreenshot: ${DEVICE}-audit-tile-not-added
      - tapOn:
          id: 'sale-tile-Ring Zircon'
- assertVisible: '.*متوفر 2.*'
# The price changes while the piece is in the cart.
- tapOn: 'المنتجات'
- tapOn: '.*Ring Zircon.*'
- runFlow:
    file: subflows/scroll-form.yaml
    env:
      ID: 'product-price'
- tapOn:
    id: 'product-price'
- eraseText
- inputText: '300'
- tapOn:
    id: 'keyboard.toolbar.done'
- runFlow:
    file: subflows/scroll-form.yaml
    env:
      ID: 'product-save'
- tapOn:
    id: 'product-save'
- tapOn: 'بيع'
- runFlow:
    when:
      visible:
        id: 'cart-bar'
    commands:
      - tapOn:
          id: 'cart-bar'
- tapOn:
    id: 'cart-checkout'
- runFlow:
    file: subflows/scroll-form.yaml
    env:
      ID: 'checkout-confirm'
- tapOn:
    id: 'checkout-confirm'
- assertVisible: 'تغيّرت الأسعار'
- takeScreenshot: ${DEVICE}-price-changed
- tapOn: 'تحديث الأسعار'
- runFlow:
    file: subflows/scroll-form.yaml
    env:
      ID: 'checkout-confirm'
- tapOn:
    id: 'checkout-confirm'
- extendedWaitUntil:
    visible:
      id: 'sold-title'
    timeout: 30000
- assertVisible: '.*300.*'
- tapOn:
    id: 'sold-new-sale'
# Deleting it asks about its receipt.
- runFlow:
    file: subflows/open-section.yaml
    env:
      ID: 'manage-sales'
- tapOn:
    index: 0
    id: 'sale-[0-9]+'
- assertVisible: '.*300.*'
- scrollUntilVisible:
    element:
      id: 'sale-delete'
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn:
    id: 'sale-delete'
- takeScreenshot: ${DEVICE}-delete-sale
- tapOn: 'حذف البيعة وإبقاء الإيصال'
